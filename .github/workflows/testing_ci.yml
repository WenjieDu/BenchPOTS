name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: '3.10'
                      suite: full
                    - os: ubuntu-latest
                      python-version: '3.14'
                      suite: full
                    - os: macos-15
                      python-version: '3.13'
                      suite: smoke
                    - os: windows-latest
                      python-version: '3.12'
                      suite: smoke

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}
                  check-latest: true
                  cache: pip
                  cache-dependency-path: requirements/requirements.txt

            - name: Install Python 3.10 numerical dependencies
              if: matrix.python-version == '3.10'
              run: |
                  python -m pip install --only-binary=:all: "numpy==2.2.6" "scipy==1.15.3"

            - name: Install Python 3.12+ numerical dependencies
              if: matrix.python-version != '3.10'
              run: |
                  python -m pip install --only-binary=:all: "numpy==2.5.5" "scipy==1.18.1"

            - name: Install common dependencies
              run: >-
                  python -m pip install --only-binary=:all: "h5py==3.16.0" "pandas==2.3.3" "scikit-learn==1.7.2"
                  "torch==2.14.1" "tsdb==1.0.0rc1" "pygrinder==0.7" "rarfile==4.5" "requests==2.34.2" "tqdm==4.70.1"
                  "progressbar2==4.7.1" "pytest==9.0.3" "pytest-cov==7.0.0" "coverage==7.12.0"

            - name: Install nonlinear benchmarks without legacy progressbar dependency
              run: |
                  python -m pip install --only-binary=:all: --no-deps "nonlinear_benchmarks==1.0.1"

            - name: Run full test suite
              if: matrix.suite == 'full'
              run: python -m pytest -rA tests/test_benchpots.py -s --cov=benchpots

            - name: Run smoke test
              if: matrix.suite == 'smoke'
              run: >-
                  python -c "import benchpots; from benchpots.datasets import preprocess_random_walk;
                  data=preprocess_random_walk(n_steps=8,n_features=3,n_classes=2,n_samples_each_class=20,missing_rate=0.1);
                  assert data['train_X'].shape[-2:]==(8,3)"

            - name: Write the LCOV report
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
              run: python -m coverage lcov

            - name: Submit report
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
              continue-on-error: true
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path-to-lcov: coverage.lcov

    package-validation:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.10"

            - name: Install package validation tools
              run: |
                  python -m pip install --only-binary=:all: "build==1.6.1" "setuptools==84.2.1" "twine==6.2.0"

            - name: Build and validate distributions
              run: |
                  python -m build --no-isolation
                  python -m twine check dist/*
                  VERSION=$(python -c "import runpy; print(runpy.run_path('benchpots/version.py')['__version__'])")
                  python scripts/check_release.py --tag "v$VERSION" --dist dist

            - name: Validate wheel installation metadata
              run: |
                  python -m pip install --no-deps --no-index --target "$RUNNER_TEMP/benchpots-package" dist/*.whl
                  python -c "import importlib.metadata as m, pathlib, sys; sys.path.insert(0, str(pathlib.Path('$RUNNER_TEMP/benchpots-package'))); d=m.distribution('benchpots'); assert d.version; assert d.locate_file('benchpots/__init__.py').is_file()"

            - name: Upload validated distributions
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: validated-distributions
                  path: dist/*
                  if-no-files-found: error
